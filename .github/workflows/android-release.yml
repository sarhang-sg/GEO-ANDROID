name: GEO Android release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "assets/**"
      - "lib/**"
      - "test/**"
      - "pubspec.yaml"
      - "analysis_options.yaml"
      - "tools/**"
      - ".github/workflows/android-release.yml"

permissions:
  contents: read

concurrency:
  group: geo-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      NAV_KURD_VERSION: 8.0.4
      NAV_KURD_VERSION_CODE: 80004
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Use Flutter 3.47.1
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true

      - name: Resolve exact packages
        run: flutter pub get

      - name: Validate source and unified version
        shell: bash
        run: |
          bash tools/validate-source.sh
          manifest_version="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n 1)"
          test "$manifest_version" = "$NAV_KURD_VERSION+$NAV_KURD_VERSION_CODE"
          grep -F "defaultValue: '$NAV_KURD_VERSION'" lib/src/app_config.dart >/dev/null

      - name: Analyze and test
        run: |
          flutter analyze --no-pub --fatal-infos
          flutter test --no-pub

      - name: Configure release signing
        shell: bash
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/nav-kurd-release.jks
          {
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'storeFile=nav-kurd-release.jks\n'
          } > android/key.properties
          chmod 600 android/app/nav-kurd-release.jks android/key.properties
          expected_digest="$(tr -d '[:space:]:' < ANDROID_APP_LINK_SHA256.txt | tr '[:lower:]' '[:upper:]')"
          keystore_digest="$(keytool -list -v \
            -keystore android/app/nav-kurd-release.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" | \
            sed -n 's/^[[:space:]]*SHA256: //p' | \
            head -n 1 | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')"
          echo "Expected signing SHA-256: $expected_digest"
          echo "Keystore signing SHA-256: $keystore_digest"
          test "${#expected_digest}" -eq 64
          test "${#keystore_digest}" -eq 64
          test "$keystore_digest" = "$expected_digest"

      - name: Build signed universal and ABI APKs
        run: |
          flutter build apk --release --no-pub \
            --dart-define=NAV_KURD_APP_URL=https://geo-map-kappa.vercel.app \
            --dart-define=NAV_KURD_VERSION="$NAV_KURD_VERSION"
          flutter build apk --release --split-per-abi --no-pub \
            --dart-define=NAV_KURD_APP_URL=https://geo-map-kappa.vercel.app \
            --dart-define=NAV_KURD_VERSION="$NAV_KURD_VERSION"

      - name: Build signed Android App Bundle
        run: |
          flutter build appbundle --release --no-pub \
            --dart-define=NAV_KURD_APP_URL=https://geo-map-kappa.vercel.app \
            --dart-define=NAV_KURD_VERSION="$NAV_KURD_VERSION"

      - name: Verify signatures and checksums
        shell: bash
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/*.apk release/
          cp build/app/outputs/bundle/release/*.aab release/
          mv release/app-release.apk "release/NAV-KURD-${NAV_KURD_VERSION}.apk"
          mv release/app-release.aab "release/NAV-KURD-${NAV_KURD_VERSION}.aab"
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          apksigner="$build_tools/apksigner"
          test -x "$apksigner"
          : > release/SIGNATURES.txt
          for apk in release/*.apk; do
            echo "Verifying APK: $apk"
            "$apksigner" verify --verbose --print-certs "$apk" | tee -a release/SIGNATURES.txt
          done
          expected_digest="$(tr -d '[:space:]:' < ANDROID_APP_LINK_SHA256.txt | tr '[:lower:]' '[:upper:]')"
          apk_digest="$("$apksigner" verify --verbose --print-certs "release/NAV-KURD-${NAV_KURD_VERSION}.apk" | \
            awk '/certificate SHA-256 digest:/ { print $NF; exit }' | \
            tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')"
          echo "Expected APK SHA-256: $expected_digest"
          echo "Actual APK SHA-256:   $apk_digest"
          test "${#expected_digest}" -eq 64
          test "${#apk_digest}" -eq 64
          test "$apk_digest" = "$expected_digest"
          printf '%s\n' "$apk_digest" > release/CERTIFICATE_SHA256.txt
          echo "Verifying AAB: release/NAV-KURD-${NAV_KURD_VERSION}.aab"
          jarsigner -verify "release/NAV-KURD-${NAV_KURD_VERSION}.aab"
          cp ANDROID_APP_LINK_SHA256.txt release/
          printf 'NAV KURD %s (%s)\n' "$NAV_KURD_VERSION" "$NAV_KURD_VERSION_CODE" > release/VERSION.txt
          (cd release && sha256sum \
            *.apk \
            *.aab \
            ANDROID_APP_LINK_SHA256.txt \
            CERTIFICATE_SHA256.txt \
            SIGNATURES.txt \
            VERSION.txt > SHA256SUMS.txt)

      - name: Upload signed Android release
        uses: actions/upload-artifact@v4
        with:
          name: NAV-KURD-8.0.4-signed-release
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          path: release/

      - name: Remove temporary signing material
        if: always()
        run: rm -f android/app/nav-kurd-release.jks android/key.properties
