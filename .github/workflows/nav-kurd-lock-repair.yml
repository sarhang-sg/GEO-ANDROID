name: NAV KURD Flutter 3.47.1 lock repair

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nav-kurd-lock-repair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact repair source
        uses: actions/checkout@v6
        with:
          lfs: false
          persist-credentials: false

      - name: Use Flutter 3.47.1
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true

      - name: Generate and prove the compatible dependency lock
        shell: bash
        run: |
          set -Eeuo pipefail
          cp pubspec.lock pubspec.lock.before
          flutter pub get
          flutter pub get --enforce-lockfile
          if cmp -s pubspec.lock.before pubspec.lock; then
            echo 'The known incompatible lockfile did not change.' >&2
            exit 1
          fi
          test "$(sha256sum pubspec.lock | awk '{print $1}')" !=             'a019b010f0bd4a1c814dd64021fffbb3809715e4b4dbc4c9ebf96a256aa7a485'
          {
            printf 'schema=1\n'
            printf 'source_commit=%s\n' "$GITHUB_SHA"
            printf 'flutter=3.47.1\n'
            printf 'pubspec_lock_sha256=%s\n' "$(sha256sum pubspec.lock | awk '{print $1}')"
            flutter --version | head -n 1
          } > NAV-KURD-LOCK-REPAIR-METADATA.txt

      - name: Upload proved lock only
        uses: actions/upload-artifact@v7
        with:
          name: NAV-KURD-9.1.0-Flutter-3.47.1-lock
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
          path: |
            pubspec.lock
            NAV-KURD-LOCK-REPAIR-METADATA.txt
