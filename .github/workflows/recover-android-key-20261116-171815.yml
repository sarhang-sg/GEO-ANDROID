name: Temporary Encrypted Signing Recovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Install encryption tool
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y age

      - name: Encrypt existing signing secrets
        shell: bash
        env:
          KEY_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RECIPIENT: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIP/o+cnngRe/nxDsmiQ6JmFskYdkZVo2Tw4g3BF6CtC3
        run: |
          set -euo pipefail
          set +x
          umask 077

          for value in \
            "$KEY_B64" \
            "$STORE_PASS" \
            "$KEY_ALIAS" \
            "$KEY_PASS"; do
            test -n "$value" || {
              echo "Missing signing secret"
              exit 1
            }
          done

          mkdir -p signing
          trap 'rm -rf signing' EXIT

          printf '%s' "$KEY_B64" \
            | base64 -d \
            > signing/release.keystore

          test -s signing/release.keystore

          printf '%s' "$STORE_PASS" \
            > signing/STORE_PASSWORD.txt

          printf '%s' "$KEY_ALIAS" \
            > signing/KEY_ALIAS.txt

          printf '%s' "$KEY_PASS" \
            > signing/KEY_PASSWORD.txt

          tar -C signing -cf - . \
            | age -r "$RECIPIENT" \
              -o signing-backup.tar.age

      - name: Upload encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-signing-backup
          path: signing-backup.tar.age
          retention-days: 1
          if-no-files-found: error
